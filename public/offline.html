<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#112b52" />
    <title>Bağlantı Yok | Saha Takip</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #112b52; color: #fff; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px 24px; border-radius: 24px; background: #fff; color: #10213d; text-align: center; box-shadow: 0 20px 50px #07152d66; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; line-height: 1.6; color: #526078; }
      button { width: 100%; border: 0; border-radius: 12px; padding: 14px; background: #1f5dbb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>İnternet bağlantısı yok</h1>
      <p>Görev ve personel bilgileri güvenlik nedeniyle çevrimdışı saklanmaz. Bağlantınız geldiğinde yeniden deneyin.</p>
      <button type="button" onclick="location.reload()">Yeniden Dene</button>
    </main>
  </body>
</html>
